    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }

        @keyframes peck {
            0%, 15%, 85%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-100deg); }
            35% { transform: rotate(-80deg); }
            45% { transform: rotate(-100deg); }
            55% { transform: rotate(-70deg); }
            65% { transform: rotate(-105deg); }
            75% { transform: rotate(-90deg); }
        }

        @keyframes bodyTilt {
            0%, 15%, 85%, 100% { transform: rotate(0deg); }
            25%, 45%, 65% { transform: rotate(15deg); }
            35%, 55%, 75% { transform: rotate(10deg); }
        }

        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        @keyframes shadowShift {
            0%, 15%, 85%, 100% { transform: translateX(0) scaleX(1); }
            25%, 65% { transform: translateX(-15px) scaleX(1.1); }
        }

        .anim-head {
            animation: peck 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 180px 220px;
        }

        .anim-body {
            animation: bodyTilt 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 220px 240px;
        }

        .anim-blink {
            animation: blink 4s infinite linear;
            transform-origin: 140px 60px;
        }

        .anim-shadow {
            animation: shadowShift 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 200px 350px;
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 md:px-10 flex flex-col items-center">

    <header class="mb-10 flex items-center gap-5">
        <!-- Logo animado -->
        <svg viewBox="0 0 400 400" class="w-20 h-20 flex-shrink-0" xmlns="http://www.w3.org/2000/svg">

            <g>
                <circle cx="60" cy="348" r="4" fill="#F59E0B" />
                <circle cx="85" cy="345" r="3" fill="#F59E0B" />
                <circle cx="110" cy="349" r="5" fill="#F59E0B" />
            </g>

            <path d="M 225,260 L 225,345 L 205,345" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

            <g class="anim-body">
                <polygon points="270,210 350,230 340,260 270,260" fill="#6B7280" />
                <ellipse cx="220" cy="240" rx="75" ry="55" fill="#9CA3AF" />
            </g>

            <g class="anim-head">
                <circle cx="180" cy="220" r="26" fill="#9CA3AF" />
                <path d="M 155,220 L 135,70 L 165,70 L 200,220 Z" fill="#9CA3AF" />
                <circle cx="150" cy="70" r="25" fill="#9CA3AF" />
                <polygon points="128,65 95,75 128,82" fill="#F59E0B" />
                <g class="anim-blink">
                    <circle cx="140" cy="62" r="3" fill="#1F2937" />
                </g>
            </g>

            <g class="anim-body">
                <path d="M 170,230 Q 240,200 290,230 Q 300,250 250,260 Q 200,260 170,230 Z" fill="#6B7280" />
            </g>

            <path d="M 195,260 L 195,350 L 175,350" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>

        <div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 tracking-tight leading-tight">
                Es un 10 <span class="text-blue-600">pero...</span>
            </h1>
            <p class="text-slate-500 text-base mt-1">
                Ilustraciones vectoriales minimalistas y geométricas.
            </p>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 w-full max-w-7xl">

        <!-- TARJETA 1: PALOMA ESTÁTICA -->
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200 hover:shadow-2xl transition-shadow duration-300">

                    Versión Estática

            <div class="p-6 flex justify-center items-center bg-gradient-to-b from-blue-50 to-white">

        <!-- TARJETA 2: PALOMA ANIMADA -->

            <div class="bg-blue-50 border-b border-blue-100 px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold text-blue-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Versión Animada
                </h2>
                <span class="px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold uppercase rounded-full tracking-wider animate-pulse">
                    En Vivo
                </span>
            </div>

            <div class="p-6 flex justify-center items-center bg-gradient-to-b from-blue-50 to-white">
                <svg viewBox="0 0 400 400" class="w-full max-w-md h-auto" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="200" cy="350" rx="100" ry="8" fill="#E2E8F0" class="anim-shadow" />

                    <g>
                        <circle cx="60" cy="348" r="4" fill="#F59E0B" />
                        <circle cx="85" cy="345" r="3" fill="#F59E0B" />
                        <circle cx="110" cy="349" r="5" fill="#F59E0B" />

                    <path d="M 225,260 L 225,345 L 205,345" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

                    <g class="anim-body">
                        <polygon points="270,210 350,230 340,260 270,260" fill="#6B7280" />
                        <ellipse cx="220" cy="240" rx="75" ry="55" fill="#9CA3AF" />
                    </g>

                    <g class="anim-head">
                        <circle cx="180" cy="220" r="26" fill="#9CA3AF" />
                        <path d="M 155,220 L 135,70 L 165,70 L 200,220 Z" fill="#9CA3AF" />
                        <circle cx="150" cy="70" r="25" fill="#9CA3AF" />
                        <polygon points="128,65 95,75 128,82" fill="#F59E0B" />
                        <g class="anim-blink">
                            <circle cx="140" cy="62" r="3" fill="#1F2937" />
                        </g>
                    </g>

                    <g class="anim-body">
                        <path d="M 170,230 Q 240,200 290,230 Q 300,250 250,260 Q 200,260 170,230 Z" fill="#6B7280" />
                    </g>

                    <path d="M 195,260 L 195,350 L 175,350" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                </svg>
