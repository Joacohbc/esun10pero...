allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Dependencias autorizadas a ejecutar scripts de build (binarios nativos).
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

# No re-verificar/instalar dependencias antes de cada `pnpm run <script>`.
# Evita que el build de OpenNext (que invoca `pnpm build`) falle por la
# comprobación de estado de dependencias.
verifyDepsBeforeRun: false
