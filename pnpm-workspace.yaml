packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Dependencias autorizadas a ejecutar scripts de build (binarios nativos).
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

# No re-verificar/instalar dependencias antes de cada `pnpm run <script>`.
verifyDepsBeforeRun: false
